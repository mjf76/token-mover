<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Token Mover</title>
    <script type="module" crossorigin src="./assets/index-BAjxw22I.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-dlOkuNpj.css">
  </head>
  <body>
    <div id="app">
      <div id="loading">
        <p>⏳ Connessione...</p>
      </div>
      <div id="main" class="hidden">
        <div id="player-info">
          <span id="token-name-label"></span>
        </div>
        <div id="not-found" class="hidden">
          <p>⚠️ Token non trovato.<br>Chiedi al DM di rinominare il tuo token!</p>
        </div>
        <div id="dpad" class="hidden">
          <div class="dpad-grid">
            <button id="btn-upleft">↖️</button>
            <button id="btn-up">⬆️</button>
            <button id="btn-upright">↗️</button>
            <button id="btn-left">⬅️</button>
            <div id="step-center">
              <div id="step-count">0</div>
              <div id="step-distance">0 ft<br>0 m</div>
            </div>
            <button id="btn-right">➡️</button>
            <button id="btn-downleft">↙️</button>
            <button id="btn-down">⬇️</button>
            <button id="btn-downright">↘️</button>
          </div>
          <button id="btn-reset">🔄 Reset passi</button>
        </div>
      </div>
    </div>
  </body>
</html>
